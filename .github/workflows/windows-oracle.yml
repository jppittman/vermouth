# Runs Wine's conformance tests (winetest.exe, built from the vermouth tree)
# on real x64 Windows, so vermouth can be checked against Windows itself.
#
# winetest.exe.xz is committed under oracle/ (about 20 MB). Trigger by hand or
# by pushing a new bundle; results come back as the "windows-results" artifact.
name: windows-oracle

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Tests to run, e.g. 'gdi32 user32:msg' (empty = all)"
        required: false
        default: ""
  push:
    paths:
      - oracle/winetest.exe.xz
      - .github/workflows/windows-oracle.yml

permissions:
  contents: write

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: oracle

      - name: Unpack winetest
        shell: pwsh
        run: 7z e oracle/winetest.exe.xz -y

      - name: Run conformance tests
        shell: pwsh
        run: |
          $tests = "${{ github.event.inputs.tests }}".Split(" ", [StringSplitOptions]::RemoveEmptyEntries)
          # -c console, -q quiet, -w per-test timeout; -o writes the report instead
          # of submitting it. -m is required for full runs; no report is ever sent.
          & .\winetest.exe -c -q -w 300 -t vermouth-oracle -i "${{ matrix.os }}" -m nobody@example.invalid `
              -o report.txt -J junit.xml @tests
          "winetest exit code: $LASTEXITCODE"
          exit 0

      # Also keep the reports in git, on one results branch per image, so they
      # can be fetched without the artifact store.
      - name: Commit reports to oracle-results/${{ matrix.os }}
        if: always()
        shell: bash
        run: |
          test -f report.txt || exit 0
          branch="oracle-results/${{ matrix.os }}"
          mkdir results && cp report.txt results/ && cp junit.xml results/ 2>/dev/null || true
          cd results
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'From %s, run %s\n' "${{ github.sha }}" "${{ github.run_id }}" > SOURCE
          git add -A && git commit -qm "Windows results for ${{ github.sha }} on ${{ matrix.os }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:refs/heads/$branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results-${{ matrix.os }}
          path: |
            report.txt
            junit.xml
